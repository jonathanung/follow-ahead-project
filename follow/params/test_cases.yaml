# Human motion test cases for fake_vicon + robot starting positions for fake_odom.
# Launch with:  ros2 launch follow sim.launch.py test_case:=circle
# Or via make:  make sim TC=circle
#
# Robot always starts ONE step ahead of the human in the human's initial heading.
# (follow-ahead: the robot leads, the human follows)
#
# Human speed: 0.4 m/s — a slow walk, within the QBot Platform's capability to lead
# (QBot max linear: 0.6 m/s, normal: 0.5 m/s).

test_cases:

  circle:
    description: "Person walks CCW in a circle (r=2.5m, 0.4 m/s)"
    # Human: starts at (2.5, 0), heading North (tangent to CCW circle)
    human_motion_mode: circle
    circle_radius: 2.5
    circle_angular_speed: 0.16      # linear = r * w = 2.5 * 0.16 = 0.4 m/s
    # Robot: 1 m ahead of human in initial heading (North)
    robot_start_x: 2.5
    robot_start_y: 1.0
    robot_start_theta: 1.5708       # π/2 = facing North

  stationary:
    description: "Person stands still, facing East"
    # Human: fixed at (2.0, 0.0), facing East
    human_motion_mode: stationary
    stationary_x: 2.0
    stationary_y: 0.0
    # Robot: 1.5 m ahead (East)
    robot_start_x: 3.5
    robot_start_y: 0.0
    robot_start_theta: 0.0          # facing East

  square:
    description: "Person walks a 2x2m square at 0.4 m/s"
    # Human: starts at (0.5, -1.0) heading East (first leg)
    human_motion_mode: rectangle
    rect_width: 2.0
    rect_height: 2.0
    rect_speed: 0.4
    rect_start_x: 0.5
    rect_start_y: -1.0
    # Robot: 1 m ahead (East) of human start
    robot_start_x: 1.5
    robot_start_y: -1.0
    robot_start_theta: 0.0          # facing East

  oscillate:
    description: "Person walks East then reverses (ping-pong, 0.4 m/s)"
    # Human: starts at (0.0, 0.0) heading East
    human_motion_mode: straight
    straight_line_speed: 0.4
    straight_line_duration_sec: 5.0
    straight_line_heading_rad: 0.0
    straight_line_ping_pong: true
    # Robot: 1 m ahead (East)
    robot_start_x: 1.0
    robot_start_y: 0.0
    robot_start_theta: 0.0          # facing East

  zigzag:
    description: "Person zigzags forward (net East, 0.4 m/s, ±40°)"
    # Human: starts at (0.0, 0.0), first leg at +40° above East
    human_motion_mode: zigzag
    zigzag_segment_length: 1.5
    zigzag_speed: 0.4
    zigzag_angle_deg: 40.0
    # Robot: 1 m ahead along the net East direction
    robot_start_x: 1.0
    robot_start_y: 0.0
    robot_start_theta: 0.6981       # 40° = facing same direction as first zigzag leg

  # ── MCTS-friendly scenarios ──────────────────────────────────────────────────
  # These work within the MCTS model limits (HUMAN_TURN ≤ 8°/step, ROBOT_TURN ≤ 6°/step)
  # and showcase what the planner handles well.

  gentle_arc:
    description: "Person walks a large slow arc (r=5m, 0.4 m/s) — MCTS-friendly gradual turn"
    # At r=5m, angular_speed = v/r = 0.4/5 = 0.08 rad/s → ~1°/step at 5Hz
    # Well within HUMAN_TURN=8°/step — planner tracks this perfectly
    human_motion_mode: circle
    circle_radius: 5.0
    circle_angular_speed: 0.08      # linear = 5.0 * 0.08 = 0.4 m/s
    # Robot: 1 m ahead of human (North) along initial tangent
    robot_start_x: 5.0
    robot_start_y: 1.0
    robot_start_theta: 1.5708       # π/2 = facing North

  approach_and_hold:
    description: "Person walks toward robot then stops — tests distance control"
    # Robot starts far (3m), human walks East; robot must back up to hold 1.5m gap
    human_motion_mode: straight
    straight_line_speed: 0.4
    straight_line_duration_sec: 8.0
    straight_line_heading_rad: 0.0  # East
    straight_line_ping_pong: false
    # Robot: 3 m ahead (East) — robot must retreat to maintain D_TARGET=1.5m
    robot_start_x: 3.0
    robot_start_y: 0.0
    robot_start_theta: 0.0          # facing East

  gentle_zigzag:
    description: "Person zigzags with small angle (net East, 0.4 m/s, ±12°) — MCTS-friendly"
    # 12° per leg is within the HUMAN_TURN=8°/step model assumption at typical step rates
    human_motion_mode: zigzag
    zigzag_segment_length: 2.0
    zigzag_speed: 0.4
    zigzag_angle_deg: 12.0
    # Robot: 1 m ahead along net East direction
    robot_start_x: 1.0
    robot_start_y: 0.0
    robot_start_theta: 0.2094       # 12°
