/**:
  ros__parameters:

    # --- mode ---
    sim: true                # true = simulation, false = real robot with Vicon

    # --- grid ---
    cell_size: 0.5           # metres per planning grid cell (must match planner.py)

    # --- timing ---
    decision_hz: 5.0         # how often MCTS replans (Hz)
    time_budget: 0.15        # wall-clock seconds per MCTS call (= 1/decision_hz * ~75%)

    # --- motion ---
    # QBot Platform hardware limits (from qbot_driver/params/qbot_nav2.yaml):
    #   max linear:  0.6 m/s   max angular: 0.5 rad/s   max accel: 0.5 m/s²
    robot_vel: 0.5           # m/s normal speed — keeps headroom for angular motion
    robot_vel_fast: 0.6      # m/s catch-up speed (hardware max)
    turn_speed: 0.5          # rad/s (hardware max angular velocity)
